services:
  - type: web
    name: medconnect-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: MONGODB_URI
        value: ${MONGODB_URI}
      - key: JWT_SECRET
        value: ${JWT_SECRET}
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://medconnect-frontend.onrender.com

  - type: static
    name: medconnect-frontend
    staticPublishPath: dist/medconnect/browser
    buildCommand: cd frontend && npm install && npm run build
    envVars:
      - key: ANGULAR_ENVIRONMENT
        value: production
