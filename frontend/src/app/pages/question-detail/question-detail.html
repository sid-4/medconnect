@if (question) {
  <div class="container mt-4">
    <div class="card mb-4">
      <div class="card-body">
        @if (isEditing) {
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" class="form-control" [(ngModel)]="editTitle">
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" [(ngModel)]="editDescription" rows="4"></textarea>
          </div>
          <button class="btn btn-success btn-sm me-2" (click)="saveEdit()">Save</button>
          <button class="btn btn-secondary btn-sm" (click)="toggleEdit()">Cancel</button>
        } @else {
          <h3>{{ question.title }}</h3>
          <p>{{ question.description }}</p>
          <small class="text-muted">
            Asked by {{ question.author?.username || 'Anonymous' }} on {{ question.createdAt | date:'medium' }}
          </small>

          @if (isOwner()) {
            <div class="mt-3">
              <button class="btn btn-outline-primary btn-sm me-2" (click)="toggleEdit()">Edit</button>
              <button class="btn btn-outline-danger btn-sm" (click)="deleteQuestion()">Delete</button>
            </div>
          }
        }
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-body">
        <h5>Your Answer</h5>
        <form (ngSubmit)="submitAnswer()">
          <div class="mb-3">
            <textarea class="form-control" [(ngModel)]="newAnswer" name="answer" rows="3" placeholder="Write your answer..." required></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Submit Answer</button>
        </form>
      </div>
    </div>

    <app-answer-list [answers]="answers" (answerUpdated)="loadAnswers(question._id)"></app-answer-list>
  </div>
}
